[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vrse-pytorch"
version = "0.1.0a1"
description = "Validated regional support expansion for conservative online adaptation in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Byte-Naut" }
]
keywords = [
  "online-learning",
  "continual-learning",
  "uncertainty",
  "selective-prediction",
  "pytorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "scipy",
]

[project.optional-dependencies]
benchmark = [
  "numpy",
  "scikit-learn>=1.3",
  "matplotlib",
]
test = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/Byte-Naut/vrse-pytorch"
Repository = "https://github.com/Byte-Naut/vrse-pytorch"
Issues = "https://github.com/Byte-Naut/vrse-pytorch/issues"
Archive = "https://doi.org/10.5281/zenodo.21653095"

[tool.setuptools.packages.find]
include = ["vrse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
