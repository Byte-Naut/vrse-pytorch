<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">VRSE lifecycle</title>
  <desc id="desc">Unknown samples train an isolated shadow expert. An independent exam creates a regional permission. Requests inside the verified region use the promoted expert; all other requests use the frozen baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Inter,Segoe UI,Arial,sans-serif; fill: #0f172a; }
      .label { font: 700 20px Inter,Segoe UI,Arial,sans-serif; fill: #0f172a; }
      .copy { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #475569; }
      .small { font: 600 14px Inter,Segoe UI,Arial,sans-serif; fill: #64748b; letter-spacing: .04em; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" class="title">Learning is not deployment. VRSE separates the two.</text>

  <rect x="58" y="105" width="238" height="142" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="82" y="142" class="small">1 · KEEP SERVING</text>
  <text x="82" y="177" class="label">Frozen baseline</text>
  <text x="82" y="207" class="copy">The known service never</text>
  <text x="82" y="231" class="copy">learns from unknown data.</text>

  <path d="M 296 176 L 352 176" class="arrow"/>
  <rect x="354" y="105" width="238" height="142" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="378" y="142" class="small">2 · LEARN IN ISOLATION</text>
  <text x="378" y="177" class="label">Shadow expert</text>
  <text x="378" y="207" class="copy">New labels update a candidate,</text>
  <text x="378" y="231" class="copy">never the live service.</text>

  <path d="M 592 176 L 648 176" class="arrow"/>
  <rect x="650" y="105" width="238" height="142" rx="18" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="674" y="142" class="small">3 · VERIFY</text>
  <text x="674" y="177" class="label">Independent exam</text>
  <text x="674" y="207" class="copy">Held-out new data + a guard</text>
  <text x="674" y="231" class="copy">for protected old behavior.</text>

  <path d="M 888 176 L 944 176" class="arrow"/>
  <rect x="946" y="105" width="396" height="142" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="970" y="142" class="small">4 · GRANT LIMITED PERMISSION</text>
  <text x="970" y="177" class="label">Promoted regional snapshot</text>
  <text x="970" y="207" class="copy">The tested expert is frozen and authorized only</text>
  <text x="970" y="231" class="copy">inside the support region demonstrated by evidence.</text>

  <text x="58" y="326" class="small">SERVING AFTER PROMOTION</text>
  <circle cx="110" cy="413" r="44" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="82" y="420" class="label">input</text>
  <path d="M 154 413 L 268 413" class="arrow"/>

  <path d="M 337 350 L 406 413 L 337 476 L 268 413 Z" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="302" y="404" class="copy">inside</text>
  <text x="292" y="428" class="copy">region?</text>

  <path d="M 406 413 L 518 413" class="arrow"/>
  <text x="449" y="397" class="small">YES</text>
  <rect x="520" y="350" width="326" height="126" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="546" y="388" class="small">AUTHORIZED PATH</text>
  <text x="546" y="423" class="label">Baseline + promoted expert</text>
  <text x="546" y="452" class="copy">Adapted prediction in the verified region.</text>

  <path d="M 337 476 L 337 516 L 940 516 L 940 476" class="arrow"/>
  <text x="353" y="502" class="small">NO</text>
  <rect x="942" y="350" width="400" height="126" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="968" y="388" class="small">DEFAULT PATH</text>
  <text x="968" y="423" class="label">Exact frozen baseline</text>
  <text x="968" y="452" class="copy">Old and adjacent unknown regions stay unchanged.</text>
</svg>
